1) rodar npx npm-check-updates -u    para atualizar os pacotes do projeto


2) adicionar o standard :   npm i standard -d
3) eslint-plugin-jest: npm i eslint-plugin-jest -d

4) adicionar configuracao standard para jest: 
  "standard": {
    "env": ["jest"]
  },

5) instalar o lint-staged: npm i lint-staged -d

   "lint-staged": {
    "*.js": [
      "standard --fix",
      "npm run test:staged",
      "git add"
    ]
  },

6) instalar o husky: npm i husky -d